[build]
base = "frontend/vatfaktura"
command = "npm install --legacy-peer-deps && npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200

  [redirects.query]
  url = ":url"
  w = ":width"
  q = ":quality"

[context]

  [context.branch-deploy]

    [[context.branch-deploy.headers]]
    for = "/_next/static/*"

      [context.branch-deploy.headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  [context.clean-deploy]

    [[context.clean-deploy.headers]]
    for = "/_next/static/*"

      [context.clean-deploy.headers.values]
      Cache-Control = "public, max-age=31536000, immutable"